<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Excel Pro Master - Advanced Learning Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #fff;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: #fff;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .stat-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
      margin: 10px 0;
    }

    .stat-label {
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
    }

    .progress-section {
      background: #fff;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .progress-bar {
      background: #e0e0e0;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin: 15px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      width: 0%;
      transition: width 0.3s ease;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      background: #fff;
      border: 2px solid #ddd;
      padding: 12px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      font-size: 15px;
    }

    .tab-btn:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .module-card {
      background: #fff;
      border-radius: 15px;
      padding: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .module-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #667eea, #764ba2);
    }

    .module-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.15);
      border-color: #667eea;
    }

    .module-card.locked {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .module-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .module-title {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .module-desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      background: #f0f0f0;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      margin: 3px 3px 3px 0;
      color: #666;
      font-weight: bold;
    }

    .badge.locked {
      background: #ffebee;
      color: #c62828;
    }

    .badge.completed {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .mission-container {
      background: #fff;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      display: none;
    }

    .mission-container.active {
      display: block;
    }

    .mission-header {
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 20px;
      margin-bottom: 25px;
    }

    .mission-number {
      font-size: 13px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .mission-title {
      font-size: 28px;
      font-weight: bold;
      color: #333;
      margin: 8px 0;
    }

    .concept-box {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      border-left: 4px solid #667eea;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }

    .concept-title {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .code-block {
      background: #2d2d2d;
      color: #4af699;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      margin-top: 12px;
      overflow-x: auto;
      font-size: 14px;
    }

    .challenge-section {
      margin: 30px 0;
    }

    .challenge-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }

    .options-grid {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      background: #f5f5f5;
      border: 2px solid #ddd;
      padding: 15px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.3s ease;
      font-size: 15px;
      font-weight: 500;
    }

    .option-btn:hover {
      border-color: #667eea;
      background: #f9f9ff;
    }

    .option-btn.correct {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
    }

    .option-btn.wrong {
      background: #ffebee;
      border-color: #f44336;
      color: #c62828;
    }

    .input-group {
      margin: 20px 0;
    }

    .input-field {
      width: 100%;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.3s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      font-size: 15px;
      margin: 8px 4px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .btn.secondary {
      background: #f5f5f5;
      color: #333;
      border: 2px solid #ddd;
    }

    .btn.secondary:hover {
      border-color: #667eea;
      color: #667eea;
    }

    .feedback-msg {
      padding: 15px;
      border-radius: 10px;
      margin: 20px 0;
      font-weight: bold;
      display: none;
    }

    .feedback-msg.show {
      display: block;
    }

    .feedback-msg.success {
      background: #e8f5e9;
      border: 2px solid #4caf50;
      color: #2e7d32;
    }

    .feedback-msg.error {
      background: #ffebee;
      border: 2px solid #f44336;
      color: #c62828;
    }

    .profile-section {
      display: none;
    }

    .profile-section.active {
      display: block;
    }

    .achievements {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .achievement {
      background: linear-gradient(135deg, #ffd89b 0%, #19547b 100%);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .achievement-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    @media (max-width: 768px) {
      header h1 { font-size: 24px; }
      .modules-grid { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .tabs { flex-direction: column; }
      .tab-btn { width: 100%; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>⚡ Excel Pro Master</h1>
    <p>Master Excel with Interactive Challenges & Gamification</p>
  </header>

  <div class="container">
    <!-- Stats Section -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">📊 Level</div>
        <div class="stat-value" id="level">1</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">⭐ Experience</div>
        <div class="stat-value" id="xp">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🏆 Rank</div>
        <div class="stat-value" id="rank">Novice</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">🔥 Streak</div>
        <div class="stat-value" id="streak">0</div>
      </div>
    </div>

    <!-- Progress Section -->
    <div class="progress-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="font-weight: bold; color: #333;">Level Progress</span>
        <span id="progress-text" style="color: #999; font-size: 14px;">0/100</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('learn')">📚 Learn</button>
      <button class="tab-btn" onclick="switchTab('play')">🎮 Play</button>
      <button class="tab-btn" onclick="switchTab('profile')">🏅 Profile</button>
    </div>

    <!-- Learn Section -->
    <div id="learn" class="modules-grid">
      <!-- Modules loaded here -->
    </div>

    <!-- Play Section -->
    <div id="play" class="hidden">
      <div id="mission" class="mission-container"></div>
    </div>

    <!-- Profile Section -->
    <div id="profile" class="hidden">
      <div style="background: #fff; border-radius: 15px; padding: 30px; box-shadow: 0 6px 20px rgba(0,0,0,0.1);">
        <h2 style="margin-bottom: 20px; font-size: 24px;">🏅 Your Journey</h2>
        <div id="profile-content"></div>
        <button class="btn" style="background: #f44336; margin-top: 30px;" onclick="if(confirm('Reset all progress?')) { localStorage.clear(); location.reload(); }">🗑️ Reset Progress</button>
      </div>
    </div>
  </div>

  <script>
    const modules = [
      {
        id: 'basic',
        name: 'Excel Basics',
        icon: '🟢',
        desc: 'Master cells, ranges & references',
        lessons: [
          { t: 'Cell Address', d: 'A cell address combines a column letter (A, B, C...) and row number (1, 2, 3...). Example: D8 refers to column D, row 8.', code: 'D8', type: 'mcq', q: 'Which is a valid cell address?', options: ['8D', 'D8', 'DD', 'Row8'], ans: 1 },
          { t: 'Rows & Columns', d: 'Rows run horizontally and are numbered (1, 2, 3...). Columns run vertically and use letters (A, B, C...).', code: 'Row = Horizontal | Column = Vertical', type: 'mcq', q: 'Which identifies a column in Excel?', options: ['12', 'B', 'Row 12', 'Cell'], ans: 1 },
          { t: 'Range Selection', d: 'A range is a group of cells. A1:A10 selects cells from A1 to A10. A1:C3 selects a 3x3 block.', code: 'A1:A10', type: 'type', q: 'Write the range from B2 to B8:', ans: 'B2:B8' },
          { t: 'Relative Reference', d: 'Relative references change when copied. If you copy A1 to the right, it becomes B1. Useful for copying formulas.', code: 'A1', type: 'mcq', q: 'Which reference changes when copied to another cell?', options: ['$A$1', 'A1', 'Sheet1!$A$1', 'None'], ans: 1 },
          { t: 'Absolute Reference', d: 'Absolute references stay the same when copied. $A$1 locks both column and row. $A1 locks column only. A$1 locks row only.', code: '$A$1', type: 'mcq', q: 'Which fully locks both row and column?', options: ['A1', '$A$1', 'A$1', '$A1'], ans: 1 }
        ]
      },
      {
        id: 'formula',
        name: 'Formulas 101',
        icon: '🧮',
        desc: 'Learn SUM, AVERAGE, MIN, MAX',
        lessons: [
          { t: 'Formula Syntax', d: 'All Excel formulas start with = sign. This tells Excel you\'re entering a formula, not just text.', code: '=SUM(A1:A10)', type: 'mcq', q: 'Which character starts an Excel formula?', options: ['+', '=', '@', '#'], ans: 1 },
          { t: 'SUM Function', d: 'SUM adds all numbers in a range. Example: =SUM(A1:A10) adds A1 through A10. You can also use =SUM(A1, A3, A5) for specific cells.', code: '=SUM(A1:A10)', type: 'type', q: 'Write a formula to sum A1:A10:', ans: '=SUM(A1:A10)' },
          { t: 'AVERAGE Function', d: 'AVERAGE calculates the mean of numbers. =AVERAGE(B2:B10) adds all values and divides by count.', code: '=AVERAGE(B2:B10)', type: 'type', q: 'Write formula to average B2:B10:', ans: '=AVERAGE(B2:B10)' },
          { t: 'MIN & MAX', d: 'MIN finds the smallest value. MAX finds the largest. Both work with ranges: =MIN(C2:C20) or =MAX(C2:C20).', code: '=MAX(C2:C20)', type: 'mcq', q: 'Which finds the largest number in C2:C20?', options: ['MIN', 'MAX', 'AVERAGE', 'COUNT'], ans: 1 },
          { t: 'ROUND Function', d: 'ROUND rounds numbers to specified decimal places. =ROUND(A1, 2) rounds A1 to 2 decimal places. =ROUND(3.14159, 2) = 3.14', code: '=ROUND(A1,2)', type: 'type', q: 'Write formula to round A1 to 2 decimals:', ans: '=ROUND(A1,2)' }
        ]
      },
      {
        id: 'logic',
        name: 'Logic Functions',
        icon: '🧠',
        desc: 'IF, AND, OR, COUNTIF, SUMIF',
        lessons: [
          { t: 'IF Function', d: 'IF tests a condition and returns different values based on true/false. Syntax: =IF(condition, value_if_true, value_if_false)', code: '=IF(A1>=50,"Pass","Fail")', type: 'type', q: 'Formula to show Pass if A1≥50, else Fail:', ans: '=IF(A1>=50,"Pass","Fail")' },
          { t: 'AND Function', d: 'AND returns TRUE only if ALL conditions are TRUE. Example: =AND(A1>50, B1="Yes") is TRUE only if BOTH conditions are true.', code: '=AND(A1>=50, B1="Yes")', type: 'mcq', q: 'AND returns TRUE when...', options: ['any condition is true', 'all conditions are true', 'no condition is true', 'only text'], ans: 1 },
          { t: 'OR Function', d: 'OR returns TRUE if AT LEAST ONE condition is TRUE. Example: =OR(A1="Yes", B1="Yes") is TRUE if either is Yes.', code: '=OR(A1="Yes", B1="Yes")', type: 'mcq', q: 'OR needs minimum how many TRUE conditions?', options: ['0', '1', '2', '3'], ans: 1 },
          { t: 'COUNTIF', d: 'COUNTIF counts cells matching a condition. =COUNTIF(A1:A20,"Apple") counts how many cells have "Apple".', code: '=COUNTIF(A1:A20,"Apple")', type: 'type', q: 'Count "Apple" in A1:A20:', ans: '=COUNTIF(A1:A20,"Apple")' },
          { t: 'SUMIF', d: 'SUMIF sums values based on a condition. =SUMIF(A1:A20,"North",B1:B20) sums B values where A="North".', code: '=SUMIF(A1:A20,"North",B1:B20)', type: 'type', q: 'Sum B1:B20 where A1:A20="North":', ans: '=SUMIF(A1:A20,"North",B1:B20)' }
        ]
      },
      {
        id: 'lookup',
        name: 'Lookup Masters',
        icon: '🔎',
        desc: 'XLOOKUP, VLOOKUP, Text functions',
        lessons: [
          { t: 'XLOOKUP', d: 'XLOOKUP searches for a value and returns a result from another column. Modern and more flexible than VLOOKUP.', code: '=XLOOKUP("Phone",A2:A10,B2:B10)', type: 'type', q: 'Find "Phone" in A2:A10, return B2:B10:', ans: '=XLOOKUP("Phone",A2:A10,B2:B10)' },
          { t: 'VLOOKUP', d: 'VLOOKUP searches the first column and returns a value from another column. =VLOOKUP(E2,A2:C20,3,FALSE) searches E2 in A column.', code: '=VLOOKUP(E2,A2:C20,3,FALSE)', type: 'mcq', q: 'VLOOKUP searches which column?', options: ['Last', 'First', 'Middle', 'Header'], ans: 1 },
          { t: 'LEFT Function', d: 'LEFT extracts characters from the start. =LEFT(A2,4) returns first 4 characters of A2. "Excel" → "Exce"', code: '=LEFT(A2,4)', type: 'mcq', q: 'Get first 4 characters of A2:', options: ['LEFT(A2,4)', 'RIGHT(A2,4)', 'MID(A2,4)', 'END(A2,4)'], ans: 0 },
          { t: 'RIGHT Function', d: 'RIGHT extracts from the end. =RIGHT(A2,4) returns last 4 characters. "Excel" → "xcel"', code: '=RIGHT(A2,4)', type: 'mcq', q: 'Get last 4 characters of A2:', options: ['LEFT(A2,4)', 'RIGHT(A2,4)', 'MID(A2,4)', 'START(A2,4)'], ans: 1 },
          { t: 'CONCAT Function', d: 'CONCAT joins text strings. =CONCAT(A2," ",B2) combines A2, space, and B2. "John" + " " + "Doe" = "John Doe"', code: '=CONCAT(A2," ",B2)', type: 'type', q: 'Combine A2, space, B2:', ans: '=CONCAT(A2," ",B2)' }
        ]
      },
      {
        id: 'data',
        name: 'Data Tools',
        icon: '📊',
        desc: 'Sort, Filter, Tables, Validation',
        lessons: [
          { t: 'Sorting Data', d: 'Sort arranges data alphabetically or numerically. A→Z or Z→A for text, Low→High or High→Low for numbers.', code: 'Data → Sort', type: 'mcq', q: 'Which arranges from largest to smallest?', options: ['Filter', 'Sort', 'Freeze', 'Find'], ans: 1 },
          { t: 'Filter Feature', d: 'Filter hides rows that don\'t match criteria. You can filter by text, numbers, dates. Click Data → Filter to enable.', code: 'Data → Filter', type: 'mcq', q: 'Which hides rows not matching criteria?', options: ['Sort', 'Filter', 'Merge', 'Wrap'], ans: 1 },
          { t: 'Excel Tables', d: 'Convert range to Table (Ctrl+T) for structured data. Tables include automatic filters and formulas update automatically.', code: 'Ctrl + T', type: 'mcq', q: 'Shortcut to create a Table:', options: ['Ctrl+T', 'Ctrl+P', 'Ctrl+L', 'Ctrl+Shift+T'], ans: 0 },
          { t: 'Data Validation', d: 'Data Validation restricts input to specific values. Create drop-down lists: Data → Data Validation → List.', code: 'Data → Validation', type: 'mcq', q: 'Create in-cell drop-down:', options: ['Validation', 'Formatting', 'Goal Seek', 'Solver'], ans: 0 },
          { t: 'Conditional Format', d: 'Highlight cells based on values. Example: Color cells >100 red. Home → Conditional Formatting.', code: 'Home → Conditional', type: 'mcq', q: 'Highlights cells >100 automatically:', options: ['Format', 'Merge', 'VLOOKUP', 'Comment'], ans: 0 }
        ]
      },
      {
        id: 'analysis',
        name: 'Analysis Pro',
        icon: '📈',
        desc: 'Pivot Tables, Charts, Dashboards',
        lessons: [
          { t: 'Pivot Tables', d: 'Pivot Tables summarize large data instantly. Drag fields to rows/columns for analysis. Insert → Pivot Table.', code: 'Insert → PivotTable', type: 'mcq', q: 'Best for quick sales summary by region:', options: ['WordArt', 'Pivot Table', 'Break', 'Spell'], ans: 1 },
          { t: 'Charts', d: 'Charts visualize data. Line for trends, Bar for comparison, Pie for percentages. Insert → Chart.', code: 'Insert → Chart', type: 'mcq', q: 'Best for trends over time:', options: ['Line', 'WordArt', 'TextBox', 'Comment'], ans: 0 },
          { t: 'Column Charts', d: 'Column charts compare values across categories. Good for sales by region, monthly totals.', code: 'Vertical Bars', type: 'mcq', q: 'Use for comparing values by category:', options: ['Pie', 'Column', 'Scatter', 'Area'], ans: 1 },
          { t: 'Pie Charts', d: 'Pie charts show percentages of a whole. Use when parts sum to 100%.', code: 'Circular', type: 'mcq', q: 'Show parts of a whole:', options: ['Line', 'Bar', 'Pie', 'Scatter'], ans: 2 },
          { t: 'Dashboard Design', d: 'Dashboards consolidate KPIs on one screen. Combine charts, tables, metrics for quick insights.', code: 'Summary View', type: 'mcq', q: 'Dashboard purpose:', options: ['Hide data', 'Quick insights', 'Formulas only', 'One cell'], ans: 1 }
        ]
      },
      {
        id: 'advanced',
        name: 'Advanced Skills',
        icon: '🚀',
        desc: 'IFERROR, FILTER, UNIQUE, Power Query',
        lessons: [
          { t: 'IFERROR', d: 'IFERROR returns a value if formula has error. =IFERROR(A1/B1,0) returns 0 if B1 is 0 (avoid #DIV/0!).', code: '=IFERROR(A1/B1,0)', type: 'type', q: 'Return 0 if A1/B1 errors:', ans: '=IFERROR(A1/B1,0)' },
          { t: 'FILTER', d: 'FILTER extracts rows matching criteria. =FILTER(A2:D20,C2:C20="North") returns rows where C="North".', code: '=FILTER(A2:D20,C2:C20="North")', type: 'type', q: 'Return A2:D20 where C="North":', ans: '=FILTER(A2:D20,C2:C20="North")' },
          { t: 'UNIQUE', d: 'UNIQUE removes duplicates. =UNIQUE(A2:A100) returns list of unique values from A2:A100.', code: '=UNIQUE(A2:A100)', type: 'type', q: 'Unique values from A2:A100:', ans: '=UNIQUE(A2:A100)' },
          { t: 'LET Function', d: 'LET names intermediate values to simplify formulas. =LET(price,100,qty,5,price*qty) = 500.', code: '=LET(x,5,x*2)', type: 'mcq', q: 'LET function benefit:', options: ['Colors', 'Variable names', 'Print', 'Tabs'], ans: 1 },
          { t: 'Power Query', d: 'Power Query transforms data from external sources. Data → Get & Transform for ETL operations.', code: 'Get & Transform', type: 'mcq', q: 'Automated data transformation:', options: ['Query', 'WordArt', 'Panes', 'Layout'], ans: 0 }
        ]
      }
    ];

    let state = {
      xp: parseInt(localStorage.getItem('emq_xp')) || 0,
      streak: parseInt(localStorage.getItem('emq_streak')) || 0,
      completed: JSON.parse(localStorage.getItem('emq_completed')) || [],
      currentModule: null,
      currentLesson: null
    };

    function save() {
      localStorage.setItem('emq_xp', state.xp);
      localStorage.setItem('emq_streak', state.streak);
      localStorage.setItem('emq_completed', JSON.stringify(state.completed));
      updateStats();
      renderModules();
    }

    function updateStats() {
      const level = Math.floor(state.xp / 250) + 1;
      const ranks = ['Novice', 'Learner', 'Expert', 'Master', 'Legend'];
      const rank = ranks[Math.min(level - 1, ranks.length - 1)];
      const progress = state.xp % 250;
      
      document.getElementById('xp').textContent = state.xp;
      document.getElementById('level').textContent = level;
      document.getElementById('streak').textContent = state.streak;
      document.getElementById('rank').textContent = rank;
      document.getElementById('progress-fill').style.width = (progress / 250 * 100) + '%';
      document.getElementById('progress-text').textContent = `${progress}/250`;
    }

    function isUnlocked(moduleIndex) {
      if (moduleIndex === 0) return true;
      return state.completed.includes(modules[moduleIndex - 1].id);
    }

    function renderModules() {
      const container = document.getElementById('learn');
      container.innerHTML = modules.map((m, i) => {
        const unlocked = isUnlocked(i);
        const completed = state.completed.includes(m.id);
        return `
          <div class="module-card ${!unlocked ? 'locked' : ''}" onclick="${unlocked ? `startModule(${i})` : ''}">
            <div class="module-icon">${m.icon}</div>
            <div class="module-title">${m.name} ${completed ? '✅' : ''}</div>
            <div class="module-desc">${m.desc}</div>
            <div>
              <span class="badge">${m.lessons.length} lessons</span>
              ${!unlocked ? '<span class="badge locked">🔒 Locked</span>' : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function startModule(moduleIndex) {
      state.currentModule = moduleIndex;
      state.currentLesson = 0;
      switchTab('play');
      renderLesson();
    }

    function renderLesson() {
      const m = modules[state.currentModule];
      const l = m.lessons[state.currentLesson];
      const isLastLesson = state.currentLesson === m.lessons.length - 1;

      let html = `
        <div class="mission-header">
          <div class="mission-number">${m.name} • Lesson ${state.currentLesson + 1}/${m.lessons.length}</div>
          <div class="mission-title">${l.t}</div>
        </div>
        
        <div class="concept-box">
          <div class="concept-title">📖 Learn This</div>
          <div>${l.d}</div>
          <div class="code-block">${l.code}</div>
        </div>

        <div class="challenge-section">
          <div class="challenge-title">🎯 Challenge</div>
          <p>${l.q}</p>
      `;

      if (l.type === 'mcq') {
        html += `
          <div class="options-grid">
            ${l.options.map((o, idx) => `
              <button class="option-btn" onclick="answerMCQ(${idx})">
                <strong>${String.fromCharCode(65 + idx)}.</strong> ${o}
              </button>
            `).join('')}
          </div>
        `;
      } else {
        html += `
          <div class="input-group">
            <input class="input-field" id="answer" placeholder="Type your answer..." onkeyup="if(event.key==='Enter') answerType()">
          </div>
          <button class="btn" onclick="answerType()">✅ Submit Answer</button>
        `;
      }

      html += `
          </div>
          <div id="feedback" class="feedback-msg"></div>
          
          <div style="margin-top: 30px; text-align: center;">
            <button class="btn secondary" onclick="showConcept()">📖 Remind Me</button>
            <button class="btn secondary" onclick="skipLesson()">⏭️ Skip</button>
            <button class="btn secondary" onclick="switchTab('learn')">📚 Back to Modules</button>
          </div>
      `;

      document.getElementById('mission').innerHTML = html;
      document.getElementById('mission').classList.add('active');
    }

    function normalize(str) {
      return String(str).trim().toLowerCase().replace(/\s+/g, '').replace(/['"]/g, '"');
    }

    function answerMCQ(selectedIdx) {
      const l = modules[state.currentModule].lessons[state.currentLesson];
      if (selectedIdx === l.ans) {
        markCorrect();
      } else {
        showError('❌ Not quite right. Try again!');
      }
    }

    function answerType() {
      const l = modules[state.currentModule].lessons[state.currentLesson];
      const user = normalize(document.getElementById('answer').value);
      const target = normalize(l.ans);
      
      if (user === target || user.replace(/;/g, ',') === target.replace(/;/g, ',')) {
        markCorrect();
      } else {
        showError('❌ Check your syntax and try again.');
      }
    }

    function markCorrect() {
      const m = modules[state.currentModule];
      const l = m.lessons[state.currentLesson];
      const key = `${m.id}-${state.currentLesson}`;

      if (!state.completed.includes(key)) {
        state.completed.push(key);
        state.xp += 50;
        state.streak++;

        if (m.lessons.every((_, i) => state.completed.includes(`${m.id}-${i}`))) {
          if (!state.completed.includes(m.id)) {
            state.completed.push(m.id);
            state.xp += 100;
          }
        }
        save();
      }

      showSuccess('🎉 Perfect! +50 XP');
      setTimeout(() => {
        if (state.currentLesson < modules[state.currentModule].lessons.length - 1) {
          state.currentLesson++;
          renderLesson();
        } else {
          alert('🏆 Module Complete! Next module unlocked.');
          switchTab('learn');
        }
      }, 1500);
    }

    function showError(msg) {
      state.streak = 0;
      save();
      const fb = document.getElementById('feedback');
      fb.textContent = msg;
      fb.className = 'feedback-msg error show';
    }

    function showSuccess(msg) {
      const fb = document.getElementById('feedback');
      fb.textContent = msg;
      fb.className = 'feedback-msg success show';
    }

    function showConcept() {
      const l = modules[state.currentModule].lessons[state.currentLesson];
      const fb = document.getElementById('feedback');
      fb.innerHTML = `<strong>💡 Tip:</strong> ${l.d}`;
      fb.className = 'feedback-msg show';
    }

    function skipLesson() {
      if (state.currentLesson < modules[state.currentModule].lessons.length - 1) {
        state.currentLesson++;
        renderLesson();
      } else {
        switchTab('learn');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('[id="learn"], [id="play"], [id="profile"]').forEach(sec => sec.classList.add('hidden'));
      
      if (tab === 'learn') {
        document.querySelector('[onclick="switchTab(\'learn\')"]').classList.add('active');
        document.getElementById('learn').classList.remove('hidden');
        document.getElementById('mission').classList.remove('active');
      } else if (tab === 'play') {
        document.querySelector('[onclick="switchTab(\'play\')"]').classList.add('active');
        document.getElementById('play').classList.remove('hidden');
      } else if (tab === 'profile') {
        document.querySelector('[onclick="switchTab(\'profile\')"]').classList.add('active');
        document.getElementById('profile').classList.remove('hidden');
        renderProfile();
      }
    }

    function renderProfile() {
      const level = Math.floor(state.xp / 250) + 1;
      const total = modules.reduce((a, m) => a + m.lessons.length, 0);
      const done = state.completed.filter(c => c.includes('-')).length;
      const percent = Math.round((done / total) * 100);
      
      const achievements = [
        { icon: '🌱', name: 'Starter', unlocked: done >= 5 },
        { icon: '🧮', name: 'Formula Expert', unlocked: done >= 15 },
        { icon: '🔎', name: 'Lookup Master', unlocked: done >= 25 },
        { icon: '📊', name: 'Data Analyst', unlocked: done >= 35 },
        { icon: '🚀', name: 'Excel Legend', unlocked: done >= 42 }
      ];

      let html = `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px;">
          <div style="background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 20px; border-radius: 12px; text-align: center;">
            <div style="font-size: 32px; font-weight: bold;">Level ${level}</div>
            <div style="font-size: 14px; opacity: 0.9;">Current Level</div>
          </div>
          <div style="background: linear-gradient(135deg, #f093fb, #f5576c); color: #fff; padding: 20px; border-radius: 12px; text-align: center;">
            <div style="font-size: 32px; font-weight: bold;">${done}/${total}</div>
            <div style="font-size: 14px; opacity: 0.9;">Lessons Done</div>
          </div>
          <div style="background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; padding: 20px; border-radius: 12px; text-align: center;">
            <div style="font-size: 32px; font-weight: bold;">${percent}%</div>
            <div style="font-size: 14px; opacity: 0.9;">Completion</div>
          </div>
        </div>
        
        <h3 style="margin: 25px 0 15px; font-size: 20px;">🏆 Achievements</h3>
        <div class="achievements">
          ${achievements.map(a => `
            <div class="achievement" style="opacity: ${a.unlocked ? '1' : '0.5'}; background: ${a.unlocked ? 'linear-gradient(135deg, #ffd89b, #19547b)' : '#ccc'};">
              <div class="achievement-icon">${a.icon}</div>
              <div>${a.name}</div>
              <div style="font-size: 12px; margin-top: 8px;">${a.unlocked ? '✅ Unlocked' : '🔒 Locked'}</div>
            </div>
          `).join('')}
        </div>
      `;
      
      document.getElementById('profile-content').innerHTML = html;
    }

    // Initialize
    updateStats();
    renderModules();
  </script>
</body>
</html>
